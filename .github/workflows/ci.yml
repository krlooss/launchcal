name: Build and Publish APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Set version info
        run: |
          VERSION=$(( ${{ github.run_number }} + 12 ))
          echo "SHORT_SHA=${GITHUB_SHA::6}" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.$VERSION" >> $GITHUB_ENV

      - run: ./gradlew assembleDebug test
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/launchcal-v${{ env.VERSION_CODE }}.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: v${{ env.VERSION_NAME }} (${{ env.SHORT_SHA }})
          files: app/build/outputs/apk/debug/launchcal-v${{ env.VERSION_CODE }}.apk
          make_latest: true

      - name: Upload APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: launchcal-v${{ env.VERSION_CODE }}.apk
          path: app/build/outputs/apk/debug/launchcal-v${{ env.VERSION_CODE }}.apk
